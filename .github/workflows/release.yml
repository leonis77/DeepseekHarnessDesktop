name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install

      - name: 安装全局 dsh（供 vendor 使用）
        run: npm install -g @deepseek-ai/dsh

      - name: Vendor + 插件 + 构建
        run: npm run vendor && npm run plugins && npm run build
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: 打包
        run: npx electron-builder --win
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Harness-UI-Setup-*.exe
            dist/Harness-UI-Setup-*.exe.blockmap
            dist/latest.yml
            dist/Harness-UI-Portable-*.exe
          generate_release_notes: true
